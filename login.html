<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HomeFinder</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/auth.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="auth-page">

    <!-- toast notifications render here via auth.js -->
    <div class="toast-container" id="toast-container"></div>

    <div class="auth-bg">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div class="auth-overlay"></div>

    <div class="auth-icons">
        <i class='bx bx-home-heart'></i>
        <i class='bx bx-key'></i>
        <i class='bx bx-map'></i>
        <i class='bx bx-buildings'></i>
        <i class='bx bx-search'></i>
        <i class='bx bx-shield-quarter'></i>
    </div>

    <a href="index.html" class="auth-back">
        <i class='bx bx-arrow-back'></i> Back to Home
    </a>

    <a href="mailto:support@homefinder.com" class="support-btn">
        <i class='bx bx-headphone'></i> <span>Contact Support</span>
    </a>

    <div class="auth-wrapper">
        <div class="auth-card login-card">

            <h1>Welcome Back</h1>
            <p class="auth-sub">Log in to continue searching for your next place.</p>

            <!-- typing status line -- filled in by auth.js during
                 the actual login request (e.g. "Verifying...") -->
            <p class="auth-status" id="login-status"></p>

            <form id="login-form">

                <div class="field-group">
                    <label for="login-email">Email or Phone Number</label>
                    <div class="input-wrap">
                        <i class='bx bx-envelope'></i>
                        <input type="text" id="login-email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="field-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrap">
                        <i class='bx bx-lock-alt'></i>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                        <button type="button" class="pass-toggle" data-target="login-password">
                            <i class='bx bx-hide'></i>
                        </button>
                    </div>
                    <p class="field-hint" style="text-align:right;">
                        <a href="#" style="color:#60A5FA;">Forgot password?</a>
                    </p>
                </div>

                <button type="submit" class="auth-submit" id="login-submit">
                    <span class="spinner"></span>
                    <span class="btn-label">Log In</span>
                </button>

            </form>

            <div class="auth-divider">or continue with</div>

            <div class="social-login">
                <button type="button" class="social-btn google" id="google-login">
                    <i class='bx bxl-google'></i> Google
                </button>
                <button type="button" class="social-btn facebook" id="facebook-login">
                    <i class='bx bxl-facebook-circle'></i> Facebook
                </button>
            </div>

            <p class="auth-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </p>

        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script src="js/transition.js"></script>
</body>
</html>
